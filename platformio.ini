; ============================================================================
; RNS Transport Node — WisBlock 1W (RAK3401 + RAK13302) / Ikoka Stick (XIAO + E22-900M30S)
; PlatformIO Build Configuration
; ============================================================================

[env:wisblock_1w_transport]
platform = nordicnrf52
board = nrf52840_dk_adafruit
framework = arduino

monitor_speed = 115200

lib_deps =
    jgromes/RadioLib@^7.1.0
    rweather/Crypto@^0.4.0

build_flags =
    -DRNS_TRANSPORT_NODE=1
    -DRADIOLIB_SX126X=1
    -DCFG_DEBUG=0
    -w
    -std=gnu++17
    -Os

build_unflags =
    -std=gnu++11

; ── Safety: generate UF2 for drag-and-drop flashing ──────
extra_scripts = post:tools/generate_uf2.py

; ── Upload via Adafruit nRF52 bootloader (safe, no JTAG needed) ──
upload_protocol = nrfutil
upload_port = /dev/ttyACM0

; ============================================================================
; Ikoka Stick — Seeed XIAO nRF52840 + EBYTE E22-900M30S (30 dBm PA)
; ============================================================================
; Hardware: https://github.com/ndoo/ikoka-stick-meshtastic-device
; Pin map + TX-power invariants live in include/RNSConfig.h under
; BOARD_IKOKA_STICK. Board JSON / linker / SoftDevice headers: see
; boards/README.md. Same lib_deps as the WisBlock env.
[env:ikoka_stick_transport]
platform = nordicnrf52
board = xiao_nrf52840_s140v7
board_build.ldscript = boards/nrf52840_s140_v7.ld
framework = arduino

monitor_speed = 115200

lib_deps =
    jgromes/RadioLib@^7.1.0
    rweather/Crypto@^0.4.0

build_flags =
    -DRNS_TRANSPORT_NODE=1
    -DRADIOLIB_SX126X=1
    -DCFG_DEBUG=0
    -w
    -std=gnu++17
    -Os
    ; ── Board / RF-module selection (consumed by include/RNSConfig.h) ──
    -DBOARD_IKOKA_STICK=1
    -DRADIO_MODULE_E22_900M30S=1
    ; ── SoftDevice S140 v7.3.0 API headers (XIAO ships SD 7.3.0) ──
    ; Must precede the BSP's 6.1.1 headers on the include path.
    -Ilib/nrf52/s140_nrf52_7.3.0_API/include
    -Ilib/nrf52/s140_nrf52_7.3.0_API/include/nrf52

build_unflags =
    -std=gnu++11

; ── Safety: generate UF2 for drag-and-drop flashing ──────
extra_scripts = post:tools/generate_uf2.py

; ── Upload via Adafruit/Seeed nRF52 bootloader (safe, no JTAG needed) ──
upload_protocol = nrfutil
upload_port = /dev/ttyACM0

; ── Test configuration ────────────────────────────────────
[env:native_test]
platform = native
build_flags =
    -DRNS_TRANSPORT_NODE=1
    -DNATIVE_TEST=1
    -std=gnu++17
test_build_src = yes
lib_deps =
    rweather/Crypto@^0.4.0
